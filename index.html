<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>benevidestiger.com</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #050505;
            color: #00ff66;
            font-family: monospace;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 600px;
            margin: auto;
            top: 50%;
            transform: translateY(-50%);
        }

        h1 {
            font-size: 24px;
            font-weight: normal;
            margin-bottom: 30px;
        }

        p {
            color: #aaa;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid #333;
            border-top: 3px solid #00ff66;
            border-radius: 50%;
            animation: girar 0.8s linear infinite;
            margin: 25px 0;
        }

        .barra {
            width: 100%;
            height: 20px;
            border: 1px solid #00ff66;
        }

        #progresso {
            height: 100%;
            width: 0%;
            background: #00ff66;
            transition: width 0.08s;
        }

        #porcentagem {
            margin-top: 10px;
        }

        #final {
            display: none;
            font-size: 28px;
            color: red;
            margin-top: 30px;
        }

        /* Códigos subindo */
        #codigo {
            display: none;
            position: fixed;
            inset: 0;
            overflow: hidden;
            opacity: 0.25;
            color: red;
            font-size: 14px;
            line-height: 18px;
            z-index: 1;
        }

        .coluna {
            position: absolute;
            top: -100%;
            white-space: pre;
            animation: subir linear infinite;
        }

        @keyframes girar {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes subir {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(200vh);
            }
        }

        .vermelho {
            background: #080000;
            color: red;
        }

        .vermelho .container {
            color: red;
        }

        .vermelho p {
            color: #ff5555;
        }

        .vermelho .barra {
            border-color: red;
        }

        .vermelho #progresso {
            background: red;
        }
    </style>
</head>

<body>

    <div id="codigo"></div>

    <div class="container">

        <h1>CARREGANDO ATAQUE HACKER AO TELEFONE...</h1>

        <p id="texto">Selecionando dados...</p>

        <div class="spinner"></div>

        <div class="barra">
            <div id="progresso"></div>
        </div>

        <div id="porcentagem">0%</div>

        <div id="final">
            ACESSO CONCLUÍDO.
        </div>

    </div>

    <script>

        let porcentagem = 0;

        const intervalo = setInterval(function() {

            porcentagem++;

            document.getElementById("progresso").style.width =
                porcentagem + "%";

            document.getElementById("porcentagem").innerText =
                porcentagem + "%";

            if (porcentagem >= 25) {
                document.getElementById("texto").innerText =
                    "Selecionando dados...";
            }

            if (porcentagem >= 50) {
                document.getElementById("texto").innerText =
                    "Analisando dispositivo...";
            }

            if (porcentagem >= 75) {
                document.getElementById("texto").innerText =
                    "Extraindo informações...";
            }

            if (porcentagem >= 90) {
                document.getElementById("texto").innerText =
                    "Finalizando acesso...";
            }

            if (porcentagem >= 100) {

                clearInterval(intervalo);

                document.querySelector(".spinner").style.display =
                    "none";

                document.getElementById("texto").innerText =
                    "Processo finalizado.";

                document.getElementById("final").style.display =
                    "block";

                document.body.classList.add("vermelho");

                iniciarCodigo();

            }

        }, 80);


        function iniciarCodigo() {

            const fundo = document.getElementById("codigo");

            fundo.style.display = "block";

            const caracteres =
                "010101001101011001010101110010100101010110101010";

            for (let i = 0; i < 35; i++) {

                const coluna = document.createElement("div");

                coluna.className = "coluna";

                let texto = "";

                for (let j = 0; j < 80; j++) {

                    texto +=
                        caracteres[Math.floor(Math.random() * caracteres.length)]
                        + "\n";

                }

                coluna.innerText = texto;

                coluna.style.left =
                    (i * 3) + "%";

                coluna.style.animationDuration =
                    (2 + Math.random() * 4) + "s";

                coluna.style.animationDelay =
                    (Math.random() * 2) + "s";

                fundo.appendChild(coluna);
            }
        }

    </script>

</body>
</html>
